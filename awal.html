<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Ulang Tahun Shiro 🎉</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap');
    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f0faff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #main-content {
      display: none; /* disembunyikan dulu */
    }
    .card {
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0,240,255,0.7), 0 0 50px rgba(0,119,255,0.5);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      text-align: center;
      animation: fadeIn 1.5s ease-in-out;
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      text-shadow: 0 0 12px #00f0ff, 0 0 20px #0077ff;
    }
    #typing-text {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 25px;
      white-space: pre-line;
      text-align: justify;
    }
    #cursor {
      display: inline-block;
      width: 10px;
      animation: blink 0.8s infinite;
      color: #00f0ff;
      font-weight: bold;
    }
    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
    .btn {
      background: transparent;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      padding: 12px 25px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 0 15px rgba(0,240,255,0.7);
    }
    .btn:hover {
      background: #00f0ff;
      color: #001f3f;
      box-shadow: 0 0 30px rgba(0,240,255,1), 0 0 60px rgba(0,119,255,0.8);
      transform: scale(1.08);
    }
    .floating-elements span {
      position: absolute;
      animation: float 12s infinite;
      font-size: 2rem;
      opacity: 0.8;
      color: #00f0ff;
      text-shadow: 0 0 15px #0077ff;
    }
    @keyframes float {
      0% { transform: translateY(100vh) rotate(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .music-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 240, 255, 0.25);
      border: 2px solid #00f0ff;
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px #00f0ff;
      transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
    }
    .music-control:hover {
      transform: scale(1.15);
      box-shadow: 0 0 30px #00f0ff, 0 0 50px #0077ff;
    }
    .music-control img {
      display: block;
      width: 40px;
      height: 40px;
    }
    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Preloader Loader Rings */
    #preloader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0f2027;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    #h3 {
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #ring {
      width: 190px;
      height: 190px;
      border: 1px solid transparent;
      border-radius: 50%;
      position: absolute;
    }
    #ring:nth-child(1) {
      border-bottom: 8px solid rgb(255, 141, 249);
      animation: rotate1 2s linear infinite;
    }
    @keyframes rotate1 {
      from { transform: rotateX(50deg) rotateZ(110deg); }
      to { transform: rotateX(50deg) rotateZ(470deg); }
    }
    #ring:nth-child(2) {
      border-bottom: 8px solid rgb(255,65,106);
      animation: rotate2 2s linear infinite;
    }
    @keyframes rotate2 {
      from { transform: rotateX(20deg) rotateY(50deg) rotateZ(20deg); }
      to { transform: rotateX(20deg) rotateY(50deg) rotateZ(380deg); }
    }
    #ring:nth-child(3) {
      border-bottom: 8px solid rgb(0,255,255);
      animation: rotate3 2s linear infinite;
    }
    @keyframes rotate3 {
      from { transform: rotateX(40deg) rotateY(130deg) rotateZ(450deg); }
      to { transform: rotateX(40deg) rotateY(130deg) rotateZ(90deg); }
    }
    #ring:nth-child(4) {
      border-bottom: 8px solid rgb(252, 183, 55);
      animation: rotate4 2s linear infinite;
    }
    @keyframes rotate4 {
      from { transform: rotateX(70deg) rotateZ(270deg); }
      to { transform: rotateX(70deg) rotateZ(630deg); }
    }

    /* === Music Player Card === */
    #music-player-card {
      position: fixed;
      bottom: 90px; /* Posisi di atas ikon musik */
      right: 20px;
      transform: scale(0); /* Mulai dari ukuran 0 */
      transform-origin: bottom right; /* Titik animasi dari pojok kanan bawah */
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 100;
      width: 100%;
      max-width: 280px; /* Dibuat lebih kecil agar persegi */
      color: #f0faff;
    }
    #music-player-card.show {
      transform: scale(1); /* Muncul ke ukuran penuh */
      opacity: 1;
    }
    .player-bg {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 240, 255, 0.5);
    }
    .player-shadow {
      box-shadow: 0 0 25px rgba(0,240,255,0.4);
    }
    .progress-bar-container {
      background: rgba(255,255,255,0.15);
    }
    .progress-bar {
      background: #00f0ff;
      box-shadow: 0 0 8px #00f0ff;
    }
    .time-text {
      color: rgba(240, 250, 255, 0.7);
    }
    .album-art {
      background-color: #2c5364;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }
    .control-btn {
      color: #f0faff;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .control-btn:hover {
      transform: scale(1.1);
      color: #00f0ff;
    }
    .animated-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 30px;
      background-color: #00f0ff; /* Disesuaikan dengan tema */
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,240,255,0.7);
      overflow: hidden;
      font-weight: bold;
      font-size: 1rem;
      text-decoration: none;
      color: #001f3f; /* Disesuaikan dengan tema */
    }
  </style>
  <!-- Tailwind CSS untuk layouting cepat -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <!-- Preloader -->
  <div id="preloader">
    <div id="container">
      <div id="ring"></div>
      <div id="ring"></div>
      <div id="ring"></div>
      <div id="ring"></div>
      <div id="h3">Sabar ya..</div>
    </div>
  </div>

  <div id="main-content">
    <canvas id="confetti"></canvas>

    <audio id="bg-music"></audio>

    <div class="card">
      <h1>🎂 Selamat Ulang Tahun Shiro 🎂</h1>
      <p id="typing-text"></p><span id="cursor">|</span>
      <a href="foto.html" class="btn">Buka Kejutan Berikutnya ➡</a>
    </div>

    <div class="floating-elements">
      <span style="left: 15%; animation-delay: 2s;">🎈</span>
      <span style="left: 35%; animation-delay: 4s;">💙</span>
      <span style="left: 55%; animation-delay: 6s;">🎉</span>
      <span style="left: 75%; animation-delay: 8s;">✨</span>
      <span style="left: 85%; animation-delay: 10s;">🎁</span>
    </div>

    <div class="music-control" onclick="toggleMusic()">
      <img id="music-icon" src="SP.png" alt="Kontrol Musik">
    </div>
  </div>

  <!-- Music Player Card -->
  <div id="music-player-card">
   <div class="relative overflow-hidden rounded-xl p-5 player-bg player-shadow">
      <div class="relative z-10">
       <div class="flex flex-col items-center text-center gap-3">
         <div class="relative h-24 w-24 shrink-0 overflow-hidden rounded-lg flex items-center justify-center album-art">
            <img src="Monokrom.jpeg" alt="Album Art" class="h-full w-full object-cover">
          </div>
         <div class="flex-1 w-full">
           <p id="song-title" class="font-semibold leading-none tracking-tight">Monokrom</p>
           <p id="song-artist" class="text-sm time-text">TULUS</p>
          </div>
        </div>
       <div class="pt-3">
          <div class="space-y-1">
            <div id="progress-container" class="relative h-1.5 w-full overflow-hidden rounded-full progress-bar-container cursor-pointer">
              <div id="music-progress" class="h-full progress-bar" style="width: 0%;"></div>
            </div>
            <div class="flex justify-between text-xs font-medium">
              <span id="current-time" class="tabular-nums time-text">0:00</span>
              <span id="total-duration" class="tabular-nums time-text">0:00</span>
            </div>
          </div>
          <div class="mt-3 flex items-center justify-center gap-6">
-           <button id="prev-btn" class="control-btn" aria-label="Previous track">
+           <button class="control-btn" aria-label="Previous track">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 18-6-6 6-6"></path><path d="M7 6v12"></path></svg>
            </button>
            <button id="play-pause-btn" class="control-btn" aria-label="Pause">
              <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="hidden"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
-           <button id="next-btn" class="control-btn" aria-label="Next track">
+           <button class="control-btn" aria-label="Next track">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 18 6-6-6-6"></path><path d="M17 6v12"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script>
    // Delay sebelum konten muncul
    window.onload = function() {
      setTimeout(() => {
        document.getElementById("preloader").style.display = "none";
        document.getElementById("main-content").style.display = "block";
        typeWriter();
      }, 5000); // delay 5 detik
    }

    // === Music Player Logic ===
    const songs = [
      {
        title: 'Monokrom',
        artist: 'TULUS',
        path: 'monokrom.mp3',
        cover: 'Monokrom.jpeg'
      },
      {
        title: 'Stecu Stecu', 
        artist: 'Faris Adam',
        path: 'stecu.mp3',
        cover: 'stecu.jpeg'
      },
    ];
    let currentSongIndex = 0;

    const music = document.getElementById('bg-music');
    const musicIcon = document.getElementById('music-icon');
    const musicPlayerCard = document.getElementById('music-player-card');
    
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    const songTitleEl = document.getElementById('song-title');
    const songArtistEl = document.getElementById('song-artist');
    const albumArt = document.querySelector('.album-art img');

    let isPlaying = false;
    let cardVisible = false;

    function loadSong(song) {
      songTitleEl.textContent = song.title;
      songArtistEl.textContent = song.artist;
      albumArt.src = song.cover;
      music.src = song.path;
    }

    function playSong() {
      music.play();
    }

    function pauseSong() {
      music.pause();
    }

    function prevSong() {
      currentSongIndex--;
      if (currentSongIndex < 0) {
        currentSongIndex = songs.length - 1;
      }
      loadSong(songs[currentSongIndex]);
      playSong();
    }

    function nextSong() {
      currentSongIndex++;
      if (currentSongIndex > songs.length - 1) {
        currentSongIndex = 0;
      }
      loadSong(songs[currentSongIndex]);
      playSong();
    }

    function toggleMusic() {
     cardVisible = !cardVisible;
     if (cardVisible) {
       musicPlayerCard.classList.add('show');
       if (!isPlaying) {
         playSong();
       }
     } else {
       musicPlayerCard.classList.remove('show');
      }
    }
    
    function handlePlayPause() {
        if (music.paused) {
            playSong();
        } else {
            pauseSong();
        }
    }

    music.onplay = () => {
        isPlaying = true;
        musicIcon.src = 'pause.png';
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
    };

    music.onpause = () => {
        isPlaying = false;
        musicIcon.src = 'SP.png';
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
    };
    
    playPauseBtn.addEventListener('click', handlePlayPause);
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);
    music.addEventListener('ended', nextSong); // Otomatis putar lagu selanjutnya saat selesai

    // Update Waktu dan Progress Bar
    const progressBar = document.getElementById('music-progress');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const progressContainer = document.getElementById('progress-container');

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
    }

    music.addEventListener('loadedmetadata', () => {
        totalDurationEl.textContent = formatTime(music.duration);
    });

    music.addEventListener('timeupdate', () => {
        const progress = (music.currentTime / music.duration) * 100;
        progressBar.style.width = `${progress}%`;
        currentTimeEl.textContent = formatTime(music.currentTime);
    });

   function setProgress(e) {
     const width = this.clientWidth; // Lebar total progress bar container
     const clickX = e.offsetX; // Posisi klik horizontal di dalam elemen
     const duration = music.duration;

     if (duration) { // Pastikan durasi lagu sudah tersedia
       music.currentTime = (clickX / width) * duration;
     }
   }
   
   progressContainer.addEventListener('click', setProgress);

    // Muat lagu pertama saat halaman dibuka
    loadSong(songs[currentSongIndex]);

   
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let pieces = [];
    const colors = ['#00f0ff','#0077ff','#ffffff'];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 100; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 6 + 2,
        d: Math.random() + 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.random() * 10 - 10
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < pieces.length; i++) {
        let p = pieces[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      update();
    }

    function update() {
      for (let i = 0; i < pieces.length; i++) {
        let p = pieces[i];
        p.y += Math.pow(p.d, 2) + 1;
        p.x += Math.sin(p.y * 0.01);
        if (p.y > canvas.height) {
          p.x = Math.random() * canvas.width;
          p.y = 0;
        }
      }
    }
    setInterval(draw, 33);

    // teks
    const fullText = "Happy Birthday! Kita mungkin sudah bukan lagi seperti dulu, tapi aku senang karena kita masih bisa jadi sahabat baik. Semoga di umur ke 17 mu ini banyak hal indah yang datang, semua impianmu tercapai, dan semoga kamu selalu kuat menghadapi apa pun, aku akan selalu ada untukmu jadi jika kamu perlu sesuatu atau pengen cerita bisa ke aku sajah. Aku bangga bisa tetap ada di sisimu sebagai sahabat atau teman.";
    const typingElement = document.getElementById("typing-text");
    const cursor = document.getElementById("cursor");
    let index = 0;

    function typeWriter() {
      if (index < fullText.length) {
        typingElement.innerHTML += fullText.charAt(index);
        index++;
        setTimeout(typeWriter, 75);
      } else {
        cursor.style.display = "none";
      }
    }
  </script>
</body>
</html>
