<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Login 🎉</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap');

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f0faff;
      overflow: hidden;
    }

    .login-box {
      width: 340px;
      padding: 30px;
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0,240,255,0.6), 0 0 40px rgba(0,119,255,0.6);
      text-align: center;
      animation: glow-border 3s infinite alternate;
    }

    @keyframes glow-border {
      from { box-shadow: 0 0 20px rgba(0,240,255,0.6), 0 0 40px rgba(0,119,255,0.6); }
      to   { box-shadow: 0 0 30px rgba(0,200,255,0.9), 0 0 50px rgba(0,255,255,0.7); }
    }

    h2 {
      margin-bottom: 20px;
      text-shadow: 0 0 12px #00f0ff, 0 0 20px #0077ff;
    }

    input[type="password"] {
      width: 90%;
      padding: 12px;
      margin-bottom: 20px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 1rem;
      font-family: 'Quicksand', sans-serif;
      background: rgba(255,255,255,0.1);
      color: #fff;
      text-align: center;
      transition: 0.3s ease;
    }

    input[type="password"]:focus {
      box-shadow: 0 0 12px #00f0ff, 0 0 20px #0077ff;
    }

    /* Tombol Animasi Baru */
    .animated-button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 16px 36px;
      border: 4px solid;
      border-color: transparent;
      font-size: 16px;
      background-color: inherit;
      border-radius: 100px;
      font-weight: 600;
      color: #00f0ff; /* Disesuaikan dengan tema */
      box-shadow: 0 0 0 2px #00f0ff; /* Disesuaikan dengan tema */
      cursor: pointer;
      overflow: hidden;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      margin: auto; /* Agar tombol ke tengah */
      width: fit-content; /* Lebar sesuai konten */
    }

    .animated-button svg {
      position: absolute;
      width: 24px;
      fill: #00f0ff; /* Disesuaikan dengan tema */
      z-index: 9;
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .animated-button .arr-1 {
      right: 16px;
    }

    .animated-button .arr-2 {
      left: -25%;
    }

    .animated-button .circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background-color: #00f0ff; /* Disesuaikan dengan tema */
      border-radius: 50%;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .animated-button .text {
      position: relative;
      z-index: 1;
      transform: translateX(-12px);
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      color: #fff; /* Warna teks awal */
      text-shadow: 0 0 6px #00f0ff, 0 0 12px #0077ff;
    }

    .animated-button:hover {
      box-shadow: 0 0 0 12px transparent;
      color: #212121;
      border-radius: 12px;
    }

    .animated-button:hover .arr-1 {
      right: -25%;
    }

    .animated-button:hover .arr-2 {
      left: 16px;
    }

    .animated-button:hover .text {
      transform: translateX(12px);
      color: #0f2027; /* Warna teks saat hover */
      text-shadow: none;
    }

    .animated-button:hover svg {
      fill: #0f2027; /* Warna ikon saat hover */
    }

    .animated-button:active {
      scale: 0.95;
      box-shadow: 0 0 0 4px #00f0ff; /* Disesuaikan dengan tema */
    }

    .animated-button:hover .circle {
      width: 220px;
      height: 220px;
      opacity: 1;
    }

    /* Pesan error */
    .error {
      color: #ff6b6b;
      margin-top: 10px;
      font-size: 0.9rem;
      display: none;
      text-shadow: 0 0 8px #ff0000;
    }

    /* Shake animation */
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-6px); }
      100% { transform: translateX(0); }
    }
    .shake {
      animation: shake 0.4s;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🔒 Sebelum Lanjut Harus Login Dulu</h2>
    <input type="password" id="password" placeholder="Masukkan Password">
    <button class="animated-button" id="loginBtn">
      <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
        ></path>
      </svg>
      <span class="text">MASUK</span>
      <span class="circle"></span>
      <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
        ></path>
      </svg>
    </button>
    <div class="error" id="errorMsg">Password salah, coba lagi!</div>
  </div>

  <script>
    const loginBtn = document.getElementById("loginBtn");
    const passwordInput = document.getElementById("password");
    const errorMsg = document.getElementById("errorMsg");
    let wrongAttempts = 0;

    const correctPassword = "Zuu Suami Kurokawa Akane"; 

    function login() {
      if (passwordInput.value === correctPassword) {
        errorMsg.style.display = "none";
        window.location.href = "awal.html"; 
      } else {
        wrongAttempts++;
        if (wrongAttempts >= 3) {
          const message = "Weh kok salah mulu sih? Berikan saya passwordnya Zuu yang baik hati dan tidak sombong";
          window.location.href = `https://wa.me/6289507720402?text=${encodeURIComponent(message)}`;
          return;
        }
        errorMsg.style.display = "block";
        passwordInput.classList.add("shake");
        setTimeout(() => passwordInput.classList.remove("shake"), 400);
      }
    }

    loginBtn.addEventListener("click", login);
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
